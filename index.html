      <h1>Luke Wolsko — Filmmaker & Director</h1>
      <p>Luke Wolsko is a filmmaker from Boulder, Colorado, based in New York. He recently graduated from NYU's Film & Television program, where he also studied the business of entertainment, media, and technology.</p>
      <p>He works across stop motion animation, live-action narrative, and experimental video, always with the aim of telling the truth, regardless of form. His projects often explore myth and memory through a highly visual, hands-on process.</p>
      <p>He has previously worked at Factory 25, Metalwork Pictures, Cygnet Gin, and JV8 Casting, and contributed animation to an upcoming documentary by Caveh Zahedi. He is currently training under director Andrew Levitas.</p>
      <h2>Films by Luke Wolsko</h2>
      <ul>
        <li>The Jealous Boyfriend and a Man Under the Bed (2025) — Director</li>
        <li>Fish Delivery #95 (2024) — Director</li>

        <li>Batch 9e (2024) — Director</li>

      </ul>

      <h2>Experience</h2>

      </ul>
      <p>Education: NYU Film & Television, Minor in Business of Entertainment</p>
      <h2>AI Filmmaking by Luke Wolsko</h2>
      <p>Luke Wolsko creates spec commercials and experimental work using AI filmmaking tools including Sora, Veo, Kling, Runway, Midjourney, and others. He approaches AI as a filmmaking tool, not a novelty, using it to serve narrative storytelling with directorial intention.</p>
      <p>His AI spec ads include work for brands such as Liquid Death, Cygnet Gin, Nova Vodka, Neuro, Voss, Midjourney, and Hearo, as well as a series of spec spots for Fact Machine News Network.</p>
      <p>His process combines multiple AI models for different purposes: Sora for character references and stylized footage, Veo for clean motion, Kling for complex character movement, Midjourney for image generation, and tools like Nano Banana Pro for upscaling and refinement. He composites and grades everything in Premiere Pro and After Effects, treating AI outputs as raw material that requires the same post-production craft as traditional footage.</p>
